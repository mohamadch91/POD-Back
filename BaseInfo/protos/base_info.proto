syntax = "proto3";

package base_info;


service BaseInfoController {
    rpc GetInfo(GetBaseInfoRequest) returns (GetBaseInfoResponse){}
 
}


message GetBaseInfoRequest{
    repeated BaseInfoRequest baseInfo = 1;


}
message BaseInfoRequest {
    string name = 1;
    int32 id = 2;

}

message GetBaseInfoResponse{
    repeated BaseInfoResponse baseInfo = 1;

}

message BaseInfoResponse{
    string key = 1;
    string value = 2;
}

