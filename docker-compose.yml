version: '3.2'
services:

  authentication:
    image: authentication:latest
    build: ./Authentication
    container_name: authentication
    command: > 
      sh -c "./grpc.sh && python manage.py runserver"
    ports:
        - 8001:8000
    env_file:
      - ./.env
    networks:
        - pod_net
    volumes:
      - ./media/pod/auth/media/:/code/media/
    depends_on:
      db:
        condition: service_healthy
  authentication-grpc:
    image: authentication:latest
    build: ./Authentication
    container_name: authentication-grpc
    command: > 
      sh -c "python manage.py customgrpcrunserver"
    ports:
        - 50051:50051
    env_file:
      - ./.env
    networks:
        - pod_net
    depends_on:
      db:
        condition: service_healthy

  baseInfo:
    image: baseinfo
    build: ./BaseInfo
    container_name: baseInfo
    command: > 
      sh -c "./grpc.sh && python manage.py runserver"
    ports:
        - 8002:8000
    volumes:
      - ./media/pod/base_info/media/:/code/media/
    env_file:
      - .env
    networks:
        - pod_net
    depends_on:
      db:
        condition: service_healthy
  baseInfo-grpc:
    image: baseinfo
    build: ./BaseInfo
    container_name: baseInfo-grpc
    command: > 
      sh -c "python3 manage.py customgrpcrunserver"
    ports:
        - 50052:50052
    env_file:
      - .env
    networks:
        - pod_net
    depends_on:
      db:
        condition: service_healthy
  commerce:
    image: commerce:latest
    build: ./Services/Commerce
    container_name: commerce
    command: > 
      sh -c "./grpc.sh && python manage.py runserver"
    volumes:
      - ./media/pod/commerce/media/:/code/media/
    ports:
        - 8003:8000
    env_file:
      - .env
    networks:
        - pod_net
    depends_on:

      db:
        condition: service_healthy

    
  service:
    image: service:latest
    build: ./Services/Service
    container_name: service
    command: > 
      sh -c "./grpc.sh && python manage.py runserver"
    ports:
        - 8004:8000
    volumes:
      - ./media/pod/service/media/:/code/media/
    env_file:
      - .env
    networks:
        - pod_net
    depends_on:
      db:
        condition: service_healthy

  log:
    image: log:latest
    build: ./logs
    container_name: logs
    command: > 
      sh -c "./grpc.sh && python manage.py runserver"
    ports:
        - 8005:8000
    networks:
        - pod_net
    volumes:
      - ./media/pod/log/media/:/code/media/
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  order:
    image: order:latest
    build: ./Services/Order
    container_name: order
    command: > 
      sh -c "./grpc.sh && python manage.py runserver"
    ports:
        - 8006:8000
    volumes:
      - ./media/pod/order/media/:/code/media/
    networks:
        - pod_net
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  content:
    image: content:latest
    build: ./content
    container_name: content
    command: > 
      sh -c "./grpc.sh && python manage.py runserver"
    ports:
        - 8007:8000
    volumes:
      - ./media/pod/content/media/:/code/media/
    networks:
        - pod_net
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:latest
    build: ./configs
    container_name: nginx
    volumes:
      - ./configs/nginx.conf:/etc/nginx/nginx.conf

    ports:
        - 80:80
        - 443:443
    
    networks:
        - pod_net
    depends_on:
      - db
      - authentication
      - baseInfo
      - commerce
      - service
      - log
      - order

    

  db_admin:
    container_name: pgAdmin
    image: dpage/pgadmin4:latest
    ports:
      - 5050:80
    volumes:
      - pg_admin_data:/var/lib/pgadmin/data/
    env_file:
      - .env
    depends_on:
      - db
    networks:
        - pod_net
  db:
    image: postgres:latest
    container_name: db
    volumes:
      - postgres_data:/var/lib/postgresql/data/
      - ./database/init.sh:/docker-entrypoint-initdb.d/create-multiple-postgresql-databases.sh
    env_file:
      - .env
    environment:
        POSTGRES_MULTIPLE_DATABASES: "$AUTH_DATABASE_NAME,  $BASE_INFO_DATABASE_NAME, $COMMERCE_DATABASE_NAME,  $SERVICE_DATABASE_NAME,  $ORDER_DATABASE_NAME, $LOGS_DATABASE_NAME $CONTENT_DATABASE_NAME"

    networks:
        - pod_net
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  pod_net:
    driver: bridge
volumes:
  postgres_data:
  pg_admin_data: