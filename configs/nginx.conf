server {
    listen 80;
    server_name "*";

    location /auth {
        proxy_pass authentication:8001;
    }

    location /baseInfo {
        proxy_pass baseinfo:8002;
    }

    location /commerce {
        proxy_pass commerce:8003;
    }
      location /service {
        proxy_pass service:8004;
    }


    # Add more location blocks for additional paths and ports

    # Default location block
    location / {
          proxy_pass http://localhost:3000;
    }
}